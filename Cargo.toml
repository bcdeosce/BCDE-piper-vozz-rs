
[package]
name = "bcde-piper-vozz-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
base64 = "0.22"
ndarray = "0.16"
ort = "=2.0.0-rc.10"
vozz-g2p-rs = { git = "https://github.com/bcdeosce/vozz-g2p-rs" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sintese"
harness = false

[lib]
name = "bcde_piper_vozz_rs"
path = "src/lib.rs"

[[bin]]
name = "bcde-piper-worker"
path = "src/bin/piper-worker.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
